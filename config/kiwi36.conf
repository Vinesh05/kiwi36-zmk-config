CONFIG_ZMK_KEYBOARD_NAME="Kiwi36"

# Boost Bluetooth transmit power to maximum (+8 dBm on nRF52840)
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enable 2M PHY for faster GATT service discovery and lower latency
CONFIG_BT_CTLR_PHY_2M=y

# Power Management (Idle after 30s, Deep Sleep after 1 hour)
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000

# Soft Off
CONFIG_ZMK_PM_SOFT_OFF=y

# ------------------------------------------------------------------------------
# ZMK Studio Support
# ------------------------------------------------------------------------------
CONFIG_ZMK_STUDIO=y
